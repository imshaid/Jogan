# Baseline policies (docs/01-logic-chain.md §2, DECISIONS.md D-019). Every number here is an
# ASSUMPTION; none is tuned on the evaluation seeds.
# Every policy plans one runner round a day and answers agents' calls with what is left.

plan_hour: 8 # the round is planned at 08:00, before the 09:00 shift (ASSUMPTION)
call_reserve_visits: 4 # per runner, kept free in the round for agents who call (ASSUMPTION)

# How a policy estimates an agent's typical day (served outflow per side) from observed history.
typical:
  history_days: 28 # ASSUMPTION
  min_days: 3 # ASSUMPTION
  # Before min_days: opening balance ÷ this. The midpoint of the simulator's 1–1.5 days of
  # opening balance (ASSUMPTION in configs/sim/base.yaml), so a rule of thumb an operator knows.
  cold_start_balance_days: 1.25

calls: {call_days: 0.25} # an agent calls below this many typical days on a side (ASSUMPTION)
threshold: {min_days: 0.75} # round to agents below this cover on either side (ASSUMPTION)
# need = mean + k·sd of the peak 24 h drain, k = the standard normal quantile of the service
# level (DERIVED in code); service level and windows are ASSUMPTION.
safety_stock: {service_level: 0.95, history_days: 28, min_days: 7}
oracle: {horizon_hours: 26} # perfect foresight over this horizon, to the next round (ASSUMPTION)
