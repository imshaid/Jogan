# Operations environment behaviour (docs/02-data-assumptions.md §6, §7).
# Every value is an ASSUMPTION unless a comment says otherwise.

# Status quo: an agent running low fetches cash or e-float itself from a bank. It happens under
# every policy; runners come on top of it.
self_refill:
  trigger_days: 0.15 # a side below this share of the agent's typical day of outflow
  delay_hours: [2, 6] # until the agent gets to the bank
  bank_hours: [10, 17] # bank-open days only; Fri/Sat bank weekend is SOURCE

retry:
  prob: 0.0 # default: a failed request is lost; sensitivity 0.3
  within_hours: 2

runner_bag_start_tk: 150000 # cash a runner loads at the hub each morning (half a bag)

# What Jogan sees: served transactions only, with gaps in the hourly data feed.
observation:
  missing_hour_prob: 0.01 # agent-hour records never arrive
  late_day_prob: 0.01 # agent-days whose records arrive only at the end of the next day
