# Operations environment behaviour (docs/02-data-assumptions.md §6, §7).
# Every number is tagged SOURCE (verified, link), DERIVED (computed in code) or ASSUMPTION.

# An agent running low also fetches cash or e-float itself from a bank. It happens under every
# policy; runners come on top of it.
self_refill:
  trigger_days: 0.15 # a side below this share of the agent's typical day (ASSUMPTION)
  delay_hours: [2, 6] # until the agent gets to the bank (ASSUMPTION)
  # Bank transaction hours 10:00–15:00 from 5 Apr 2026 (SOURCE:
  # https://www.dhakatribune.com/business/banks/406921/bb-reschedules-bank-transaction-hours).
  # Applied to the whole run, also before April and in Ramadan (ASSUMPTION). Bank-open days
  # follow the calendar's Fri/Sat weekend and holidays (SOURCE, data assumptions §2).
  bank_hours: [10, 15]

retry:
  prob: 0.0 # a failed request is lost (ASSUMPTION); sensitivity 0.3 (ASSUMPTION)
  within_hours: 2 # ASSUMPTION

runner_bag_start_tk: 150000 # cash loaded at the hub each morning, half the bag (ASSUMPTION)

# What Jogan sees: served transactions only, with gaps in the hourly data feed.
observation:
  missing_hour_prob: 0.01 # agent-hour records that never arrive (ASSUMPTION)
  late_day_prob: 0.01 # agent-days that arrive only at the end of the next day (ASSUMPTION)
