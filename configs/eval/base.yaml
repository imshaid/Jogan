# Final evaluation behind artifacts/metrics.json (`make eval`; DECISIONS.md D-010, D-019, D-021).
# Every number is tagged SOURCE (verified, link), DERIVED (computed in code) or ASSUMPTION.

profile: full # train holds Eid-ul-Fitr, test holds Eid-ul-Azha (D-010)
# Evaluation seeds, never used for development or tuning (D-010; ASSUMPTION).
seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]
# Jogan's lost-customer value (Tk per lost request) is an operator setting (D-019); the
# evaluation runs Jogan at each of these and compares it with the baselines at the same value.
# The setting in configs/plan/base.yaml must be one of them (ASSUMPTION).
lost_customer_values_tk: [0, 5, 20, 50, 100, 200]
interval_level: 0.95 # paired intervals across seeds (ASSUMPTION)
# Seeds run in parallel processes, each training LightGBM on this many threads. Fixed so that
# results do not depend on the machine's core count (ASSUMPTION, sized for a 20-thread laptop
# with about 4 GB of free memory).
workers: 2 # ASSUMPTION
lightgbm_threads: 8 # ASSUMPTION
