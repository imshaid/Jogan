[project]
name = "jogan"
version = "0.1.0"
description = "Jogan (যোগান): agent liquidity copilot prototype for mobile financial services agents, built on simulated data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md. Shaid Hasan" }]
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scratch", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "PT", "RUF"]
