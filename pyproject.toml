[project]
name = "jogan"
version = "0.1.0"
description = "Jogan (যোগান): agent liquidity copilot prototype for mobile financial services agents, built on simulated data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md. Shaid Hasan" }]
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scratch", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "PT", "RUF"]
